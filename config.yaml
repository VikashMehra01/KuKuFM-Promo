# Promo Finder configuration. Every value has a default in promo_finder/config.py;
# this file only documents and overrides them.

llm:
  # "<provider>:<model>". Providers: gemini, groq, openrouter, openai, ollama, custom.
  # Swap models here (or via env PROMO_GENERATOR / PROMO_JUDGE) - no code changes.
  generator: "gemini:gemini-2.5-flash"
  judge: "gemini:gemini-2.5-flash"
  temperature: 0.4
  judge_temperature: 0.0
  requests_per_minute: 5      # free tiers are tight; raise for paid keys
  max_retries: 4
  timeout_s: 120
  cache_dir: ".cache/llm"     # identical prompts are never paid for twice

promo:
  min_duration_s: 20
  max_duration_s: 60
  hook_window_s: 3            # hook must start within this many seconds
  max_segments: 3
  shot_snap_s: 1.0            # snap cut points to camera-shot edges within this window
  candidates_per_episode: 3
  cross_episode_candidates: 6
  include_heuristic_candidates: true   # add rule-based candidates alongside LLM ones
  # Batching (quota vs quality). ~2K tokens of script per episode, so 12K ~= 5-6 episodes/call.
  # Set max_episodes_per_call: 1 for one call per episode (strong paid models, max attention).
  batch_token_budget: 12000
  max_episodes_per_call: 6
  retry_missing_episodes: true         # re-ask once for any episode a batch skipped

ranking:
  llm_weight: 0.7
  heuristic_weight: 0.3
  rubric_weights:
    hook: 0.30
    cliffhanger: 0.25
    standalone: 0.20
    intensity: 0.15
    trope_fit: 0.10
  funnel_episodes: 10         # promos from the first N episodes get a bonus
  funnel_bonus: 0.08
  diversity_penalty: 0.05
  dedupe_iou: 0.5
  judge_batch_size: 20        # ~300 tokens per clip, so 20 clips ~= 6K tokens per call
  judge_top_k: 40             # shortlist by heuristic score before LLM judging (quota control)
  judge_shuffle_seed: 7       # shuffled (reproducibly) so batch position doesn't bias scores
  top_n: 20
