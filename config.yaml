# Promo Finder configuration. Every value has a default in promo_finder/config.py;
# this file only documents and overrides them.

llm:
  # "<provider>:<model>". Providers: gemini, groq, openrouter, openai, ollama, custom.
  # Swap models here (or via env PROMO_GENERATOR / PROMO_JUDGE) - no code changes.
  # Free tier (verified from the API's 429 details, Nov 2026): 20 requests/day PER MODEL
  # per project, and failed/overloaded (503) attempts count too. A full 50-episode run
  # needs ~14 calls, so it fits one model's daily quota.
  # Main model = the most capable model that is reliably AVAILABLE on the free tier.
  # Nov 2026: every full Flash (3.5 / 3.6 / 3.8) returned 503 "high demand" on almost every
  # call, while gemini-3.5-flash-lite answered in ~2-4s. A stable Lite beats an overloaded
  # Flash that falls back on most calls anyway. When Flash capacity recovers (or on a paid
  # key), switch to e.g. "gemini:gemini-3.8-flash" - the circuit breaker below protects you.
  # 2.5-flash is closed to new keys.
  generator: "gemini:gemini-3.5-flash-lite"
  judge: "gemini:gemini-3.5-flash-lite"
  # Used per call when the primary is overloaded (503) or out of quota (429). null disables.
  fallback: "gemini:gemini-3.1-flash-lite"
  # null = parameter not sent. Gemini 3.x docs: keep defaults; < 1.0 can cause looping.
  # Set a number (e.g. 0.4 / 0.0) for older or non-Gemini models if you want.
  temperature: null
  judge_temperature: null
  requests_per_minute: 5      # free tiers are tight; raise for paid keys
  max_retries: 4
  timeout_s: 300               # reasoning models on ~13K-token batches can be slow
  primary_retries_with_fallback: 1     # overloaded primary -> fail over fast...
  primary_timeout_with_fallback_s: 90  # ...instead of 4 retries x 300s (Lite answers in 2-40s; raise to ~240 for a full Flash)
  primary_trip_after: 2                # circuit breaker: 2 failures in a row -> stable fallback for the rest of the run
  fallback_timeout_s: 120              # the fallback is a fast Lite model; one stalled call cost 5 min before this
  cache_dir: ".cache/llm"     # identical prompts are never paid for twice

promo:
  min_duration_s: 20
  max_duration_s: 60
  hook_window_s: 3            # hook must start within this many seconds
  max_segments: 3
  shot_snap_s: 1.0            # snap cut points to camera-shot edges within this window
  candidates_per_episode: 3
  cross_episode_candidates: 6
  include_heuristic_candidates: true   # add rule-based candidates alongside LLM ones
  # Batching (quota vs quality). ~2K tokens of script per episode, so 12K ~= 5-6 episodes/call.
  # Set max_episodes_per_call: 1 for one call per episode (strong paid models, max attention).
  batch_token_budget: 12000
  max_episodes_per_call: 6
  retry_missing_episodes: true         # re-ask once for any episode a batch skipped

ranking:
  llm_weight: 0.7
  heuristic_weight: 0.3
  rubric_weights:
    hook: 0.30
    cliffhanger: 0.25
    standalone: 0.20
    intensity: 0.15
    trope_fit: 0.10
  funnel_episodes: 10         # promos from the first N episodes get a bonus
  funnel_bonus: 0.08
  diversity_penalty: 0.05
  dedupe_iou: 0.5
  judge_batch_size: 20        # ~300 tokens per clip, so 20 clips ~= 6K tokens per call
  judge_top_k: 40             # shortlist by heuristic score before LLM judging (quota control)
  judge_shuffle_seed: 7       # shuffled (reproducibly) so batch position doesn't bias scores
  top_n: 20
