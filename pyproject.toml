[project]
name = "promo-finder"
version = "0.1.0"
description = "Find ranked 20-60s promo clips in timestamped microdrama screenplays."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "pandas>=2"]
dev = ["pytest>=8"]

[project.scripts]
promo-finder = "promo_finder.cli:main"

[tool.setuptools]
packages = ["promo_finder", "promo_finder.llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
